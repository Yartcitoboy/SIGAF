name: Verificar candidata SIGAF
on:
  pull_request:
  push:
    branches: [main, isa, front-isa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://sigaf-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-no-es-una-credencial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
