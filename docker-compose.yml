version: '3.8'

services:
  # 1. Aplicación SIGAF
  sigaf-web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Aquí se define si apunta a Supabase Cloud o a la base de datos local de pruebas:
      - DATABASE_URL=postgresql://postgres:sigaf123@sigaf-db-test:5432/sigaf_test
    depends_on:
      - sigaf-db-test

  # 2. Entorno de pruebas para la base de datos (PostgreSQL)
  sigaf-db-test:
    image: postgres:16-alpine
    container_name: sigaf-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sigaf123
      POSTGRES_DB: sigaf_test
    ports:
      - "5433:5432" # Puerto 5433 en el PC para no chocar con nada local
    volumes:
      - test_db_data:/var/lib/postgresql/data

volumes:
  test_db_data: